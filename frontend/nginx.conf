server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The API is same-origin behind this server, so the browser never makes a
    # cross-origin request and CORS_ORIGINS stops mattering for the web app.
    # It still matters for the mobile app, which sends no Origin at all.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Scoring a full 48-field submission is not instant on a small box.
        proxy_read_timeout 60s;
    }

    # React Router owns the client-side routes (/login, /dashboard, /my-health,
    # /admin, /entry). Any unknown path must return index.html, not a 404, or a
    # hard reload of a deep link breaks.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite emits content-hashed filenames, so these are safe to cache forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
